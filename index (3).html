<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020817"><title>JARVIS Hologram</title>
<style>
:root{--c:#39e7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#d9faff;background:radial-gradient(ellipse at 50% 35%,#082f61,#04142c 45%,#020817 80%);font-family:system-ui,sans-serif;text-align:center}.app{max-width:850px;margin:auto;padding:22px 14px}h1{font-size:clamp(2rem,8vw,3.3rem);margin:0;color:var(--c);letter-spacing:.2em;text-shadow:0 0 22px #00bfff}header p{margin:0;color:#85cfe8;letter-spacing:.12em}.stage{position:relative;display:grid;place-items:center;min-height:360px;isolation:isolate}.stage:before,.orbit{content:"";position:absolute;width:min(82vw,330px);aspect-ratio:1;border:1px solid #00cfff55;border-radius:50%;box-shadow:0 0 35px #008cff30,inset 0 0 35px #008cff22;animation:spin 24s linear infinite;z-index:-1}.orbit{width:min(95vw,410px);border-style:dashed;animation:spin 35s linear infinite reverse}.stage:after{content:"";position:absolute;width:min(95vw,420px);height:65px;bottom:17px;border:2px solid #19cfff99;border-radius:50%;box-shadow:0 0 20px #00aaffaa,inset 0 0 20px #0088ff77;transform:perspective(240px) rotateX(55deg);animation:pulse 3s ease-in-out infinite;z-index:-1}.holo{width:min(75vw,280px);height:300px;filter:drop-shadow(0 0 16px #00aaffaa);transform-style:preserve-3d;animation:floatZoom 5s ease-in-out infinite}.face{width:100%;height:100%;overflow:visible}.shape{fill:url(#skin);stroke:#49eaff;stroke-width:2;filter:url(#glow)}.mesh{fill:none;stroke:#56eaff;stroke-width:.8;opacity:.55}.eye{fill:#a9fbff;filter:url(#glow);transform-box:fill-box;transform-origin:center;animation:blink 5.8s infinite}.pupil{fill:#007dff;filter:url(#glow)}.mouth{fill:none;stroke:#9cffff;stroke-width:3;stroke-linecap:round;filter:url(#glow)}.face[data-state=listening] .eye{animation:listen .8s ease-in-out infinite alternate}.face[data-state=thinking] .pupil{transform:translate(5px,-2px)}.face[data-state=speaking] .mouth{animation:talk .25s ease-in-out infinite alternate}.face[data-state=happy] .mouth{d:path("M 112 205 Q 140 240 168 205")}.face[data-state=alert] .eye{fill:#ff6c9d}.status{display:flex;justify-content:center;align-items:center;gap:9px;color:var(--c);letter-spacing:.12em;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:#32ffbf;box-shadow:0 0 12px #32ffbf}.message{color:#a8ddec;min-height:24px} .controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:12px 0}button{border:1px solid #1ba9df;background:linear-gradient(#0b2b4a,#06172c);color:#d9faff;padding:11px 14px;border-radius:12px;font:inherit;cursor:pointer}button.primary{background:linear-gradient(135deg,#087ab9,#063b79);border-color:#55edff}.hint{font-size:.8rem;color:#78a8bf;line-height:1.5;max-width:600px;margin:18px auto}@keyframes floatZoom{0%,100%{transform:perspective(700px) translateZ(-18px) scale(.94) translateY(5px)}50%{transform:perspective(700px) translateZ(24px) scale(1.04) translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55;scale:.94}50%{opacity:1;scale:1.04}}@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%,49%{transform:scaleY(.08)}}@keyframes listen{to{opacity:.55;transform:scale(1.13)}}@keyframes talk{from{d:path("M 112 213 Q 140 213 168 213")}to{d:path("M 112 210 Q 140 240 168 210")}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main class="app">
<header><h1>JARVIS</h1><p>PERSONAL HOLOGRAPHIC INTERFACE</p></header>
<section class="stage" aria-label="Animated holographic face"><div class="orbit"></div><div class="holo">
<svg id="face" class="face" data-state="idle" viewBox="0 0 280 320" role="img" aria-label="Blue holographic face">
<defs><radialGradient id="skin" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#1bbfff" stop-opacity=".55"/><stop offset=".7" stop-color="#0062c7" stop-opacity=".24"/><stop offset="1" stop-color="#00204d" stop-opacity=".5"/></radialGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#79f4ff" opacity=".75"/></pattern></defs>
<path class="shape" d="M72 66 Q77 23 140 20 Q203 23 208 66 L214 137 Q208 194 177 226 L163 248 L117 248 L103 226 Q72 194 66 137 Z"/><path d="M72 66 Q77 23 140 20 Q203 23 208 66 L214 137 Q208 194 177 226 L163 248 L117 248 L103 226 Q72 194 66 137 Z" fill="url(#dots)" opacity=".65"/>
<path class="mesh" d="M82 69 Q140 45 198 69 M72 94 Q140 74 208 94 M68 119 Q140 104 212 119 M70 146 Q140 135 210 146 M79 173 Q140 171 201 173 M94 200 Q140 210 186 200 M108 228 Q140 240 172 228 M92 58 L101 210 M119 30 L123 240 M140 22 L140 247 M161 30 L157 240 M188 58 L179 210"/>
<path d="M84 108 Q108 89 132 108 Q109 126 84 108Z M148 108 Q172 89 196 108 Q171 126 148 108Z" fill="#032d5e" stroke="#64f6ff" stroke-width="1.5"/><ellipse class="eye" cx="108" cy="108" rx="12" ry="6"/><ellipse class="eye" cx="172" cy="108" rx="12" ry="6"/><circle class="pupil" cx="108" cy="108" r="3.5"/><circle class="pupil" cx="172" cy="108" r="3.5"/>
<path class="mesh" d="M140 111 L129 151 L140 157 L151 151 M119 171 Q140 180 161 171 M66 105 L48 118 L52 155 L70 168 M214 105 L232 118 L228 155 L210 168 M116 248 L109 274 L140 286 L171 274 L164 248"/><path class="mouth" d="M112 205 Q140 216 168 205"/></svg>
</div></section>
<div class="status"><span class="dot" id="dot"></span><span id="status">System idle</span></div><p class="message" id="message">Hello. I am JARVIS. Choose a mode or try voice input.</p>
<div class="controls"><button data-mode="idle">Idle</button><button data-mode="listening">Listening</button><button data-mode="thinking">Thinking</button><button data-mode="speaking">Speaking</button><button data-mode="happy">Happy</button><button data-mode="alert">Alert</button></div>
<div class="controls"><button class="primary" id="listenBtn">🎙 Try voice command</button><button id="helloBtn">🔊 Say hello</button></div>
<p class="hint">The hologram continuously moves inward and outward with a pulsing ring. Voice recognition depends on your browser and microphone permissions. Try Chrome on Android or Safari on iPhone.</p>
</main><script>
const face=document.getElementById('face'),statusEl=document.getElementById('status'),message=document.getElementById('message'),dot=document.getElementById('dot');
const labels={idle:'System idle',listening:'Listening…',thinking:'Processing…',speaking:'Speaking…',happy:'All systems nominal',alert:'Alert mode'};
function setMode(mode,text){face.dataset.state=mode;statusEl.textContent=labels[mode]||labels.idle;message.textContent=text||({idle:'Standing by for your command.',listening:'I am listening. Speak now.',thinking:'Processing your request…',speaking:'Responding now.',happy:'Glad to help!',alert:'Attention required.'}[mode]);dot.style.background=mode==='alert'?'#ff477e':'#32ffbf';dot.style.boxShadow=mode==='alert'?'0 0 12px #ff477e':'0 0 12px #32ffbf'}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
function speak(text){if(!('speechSynthesis'in window)){setMode('speaking',text+' (Speech output unsupported in this browser.)');return}setMode('speaking',text);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.95;u.pitch=1.05;u.onend=()=>setMode('idle','Ready for your next command.');speechSynthesis.speak(u)}
document.getElementById('helloBtn').addEventListener('click',()=>speak('Hello. I am JARVIS, your personal assistant. How can I help you?'));
document.getElementById('listenBtn').addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setMode('listening','Voice recognition is not supported here. Try Chrome on Android; the expression buttons still work.');return}try{const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;setMode('listening','Allow microphone access if asked.');r.onresult=e=>{const words=e.results[0][0].transcript;setMode('thinking','You said: “'+words+'”');setTimeout(()=>speak('I heard you say '+words+'. Voice input is connected.'),650)};r.onerror=e=>setMode('idle','Microphone issue: '+e.error+'. Check site permissions and try again.');r.onend=()=>{if(face.dataset.state==='listening')setMode('idle','Listening stopped. Tap the microphone to try again.')};r.start()}catch(e){setMode('idle','Could not start the microphone. Check browser permissions or use the buttons.')}});
</script></body></html>
